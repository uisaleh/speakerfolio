<template id="dc-tpl"><div class="cw" data-tpl="coach"><style>
.cw{--wine:#4A1532;--wine2:#38102A;--ink:#2B1220;--cream:#FDF5EC;--peach:#F7D7BF;--sand:#F5E6D6;--muted:#75606B;--line:rgba(43,18,32,.12);
 font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:clip;font-size:16px;line-height:1.55}
.cw *{box-sizing:border-box}.cw img{display:block;max-width:100%}
.cw a{color:inherit}
.cw a.cw-btn,.cw .cw-btn{color:#fff}.cw a.cw-btn.light,.cw a.cw-btn.ghost{color:var(--wine2)}
.cw-wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.cw h1,.cw h2,.cw h3{margin:0;font-weight:500;letter-spacing:-.025em;line-height:1.12}
.cw p{margin:0}
.cw-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--wine)}
.cw-btn{display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 8px 0 22px;border-radius:999px;background:var(--wine2);color:#fff;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;white-space:nowrap}
.cw-btn .cw-arr{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--wine2);display:flex;align-items:center;justify-content:center}
.cw-btn.light{background:#fff;color:var(--wine2)}.cw-btn.light .cw-arr{background:var(--wine2);color:#fff}
.cw-btn.ghost{background:transparent;color:var(--wine2);border:1px solid rgba(56,16,42,.3);padding:0 22px}
.cw-btn:hover{filter:brightness(1.12)}
.cw-chk{flex:none;width:18px;height:18px;border-radius:50%;background:var(--wine);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.cw-play{width:68px;height:68px;border-radius:50%;background:#fff;color:var(--wine2);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
/* nav */
.cw-nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cw-nav .cw-wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.cw-logo{font-family:'Instrument Serif',Georgia,serif;font-size:31px;letter-spacing:.01em;color:var(--ink);text-decoration:none;line-height:1;cursor:pointer}
.cw-links{display:flex;gap:6px}
.cw-links a{font-size:14.5px;font-weight:500;text-decoration:none;padding:8px 14px;border-radius:999px;cursor:pointer}
.cw-links a:hover,.cw-links a.on{background:var(--cream);color:var(--wine)}
.cw-burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.cw-mob{display:none}
/* hero */
.cw-hero{position:relative;background:radial-gradient(60% 80% at 82% 60%,#F6C9A6 0%,rgba(247,215,191,.55) 38%,rgba(253,245,236,0) 70%),linear-gradient(180deg,#FFF8F1 0%,#FDF1E5 100%);overflow:hidden}
.cw-hero .cw-wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:end;min-height:640px}
.cw-hero-copy{padding:96px 0 84px;display:flex;flex-direction:column;gap:24px;align-self:center}
.cw-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--wine)}
.cw-hero h1{font-size:58px;line-height:1.06;letter-spacing:-.035em}
.cw-hero h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:var(--wine);letter-spacing:-.01em}
.cw-lead{font-size:18px;line-height:1.6;color:var(--muted);max-width:520px}
.cw-trust{display:flex;align-items:center;gap:14px;margin-top:18px}
.cw-faces{display:flex}
.cw-faces span{width:38px;height:38px;border-radius:50%;border:2.5px solid #FFF6EE;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.cw-faces span:first-child{margin-left:0}
.cw-trust small{display:block;font-size:13px;color:var(--muted)}
.cw-trust b{font-size:13.5px}
.cw-hero-art{position:relative;height:620px;align-self:end}
.cw-hero-art .glow{position:absolute;left:8%;right:2%;bottom:-60px;height:520px;border-radius:50%;background:radial-gradient(circle,#F3B98F 0%,rgba(243,185,143,0) 65%)}
.cw-hero-art img.cut{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:600px;width:auto;max-width:none}
.cw-float{position:absolute;background:#fff;border-radius:16px;box-shadow:0 18px 40px rgba(56,16,42,.16);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;font-size:13px}
.cw-float.ep{left:0;bottom:70px}
.cw-float.ep .th{position:relative;width:86px;height:58px;border-radius:10px;overflow:hidden;flex:none}
.cw-float.ep .th img{width:100%;height:100%;object-fit:cover}
.cw-float.ep .th i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.18)}
.cw-float b{display:block;font-size:13.5px;color:var(--ink)}
.cw-float small{color:var(--muted);font-size:12px}
.cw-float.cert{right:0;top:120px;padding:12px 16px}
.cw-float.cert .ic{width:36px;height:36px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center}
/* logos */
.cw-logos{border-bottom:1px solid var(--line)}
.cw-logos .cw-wrap{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:96px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.cw-logos i{font-family:'Instrument Serif',Georgia,serif;font-size:19px;color:var(--muted)}
.cw-lg{color:#8a7b83;font-size:15px;white-space:nowrap}
/* about */
.cw-about{display:grid;grid-template-columns:1fr 1fr;background:var(--wine)}
.cw-about .ph{min-height:620px;position:relative}
.cw-about .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 40%}
.cw-about .tx{padding:88px 72px;color:#fff;display:flex;flex-direction:column;gap:22px;justify-content:center;max-width:640px}
.cw-about h2{font-size:42px;color:#fff}
.cw-about p{color:rgba(255,255,255,.78);font-size:16.5px;line-height:1.7}
.cw-why{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.cw-why b{font-size:15px;color:#fff;margin-bottom:4px}
.cw-why span{display:flex;align-items:center;gap:12px;font-size:15px;color:rgba(255,255,255,.88)}
.cw-why span svg{color:#F3B98F;flex:none}
/* problem */
.cw-prob{background:var(--wine2);padding:110px 0}
.cw-prob .cw-wrap{display:grid;grid-template-columns:.95fr 1.05fr;gap:64px;align-items:center}
.cw-sol{background:#fff;border-radius:6px;padding:30px 30px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.cw-sol h3{font-size:24px}
.cw-sol p{font-size:14.5px;color:var(--muted)}
.cw-sol .ok{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;padding:14px 0 6px;border-top:1px solid var(--line)}
.cw-sol .im{margin:10px -30px 0;height:320px}
.cw-sol .im img{width:100%;height:100%;object-fit:cover;object-position:60% 30%}
.cw-prob h2{font-size:44px;color:#fff}
.cw-prob .sub{color:rgba(255,255,255,.72);font-size:16.5px;margin:16px 0 30px;max-width:520px}
.cw-rows{display:flex;flex-direction:column;gap:12px}
.cw-row{display:flex;align-items:center;gap:18px;background:#fff;border-radius:4px;padding:16px 20px}
.cw-row .ic{width:44px;height:44px;flex:none;border-radius:4px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center}
.cw-row b{display:block;font-size:15.5px}
.cw-row small{display:block;font-size:13.5px;color:var(--muted);line-height:1.45}
.cw-row .go{margin-left:auto;color:var(--wine);flex:none}
/* steps */
.cw-steps{background:var(--cream);padding:110px 0}
.cw-head{text-align:center;max-width:700px;margin:0 auto 54px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cw-head h2{font-size:44px}
.cw-head p{color:var(--muted);font-size:16.5px}
.cw-steps-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:28px;align-items:stretch}
.cw-steps-grid .ph{border-radius:6px;overflow:hidden;min-height:440px}
.cw-steps-grid .ph img{width:100%;height:100%;object-fit:cover}
.cw-step-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cw-step{background:#fff;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.cw-step .n{font-family:'Instrument Serif',Georgia,serif;font-size:46px;line-height:1;color:var(--wine)}
.cw-step h3{font-size:19px}
.cw-step p{font-size:14.5px;color:var(--muted)}
/* programs */
.cw-prog{position:relative;padding:120px 0 110px;color:#fff;overflow:hidden}
.cw-prog .bg{position:absolute;inset:0}
.cw-prog .bg img{width:100%;height:100%;object-fit:cover;object-position:center 35%}
.cw-prog .bg:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(56,16,42,.72) 0%,rgba(56,16,42,.88) 55%,#38102A 100%)}
.cw-prog .cw-wrap{position:relative}
.cw-prog-top{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end;margin-bottom:56px}
.cw-prog h2{font-size:64px;font-weight:700;font-style:italic;letter-spacing:-.04em;line-height:1.02}
.cw-prog-top p{font-size:17px;color:rgba(255,255,255,.85);line-height:1.65}
.cw-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cw-card{background:#fff;color:var(--ink);border-radius:4px;padding:30px;display:flex;flex-direction:column;gap:14px}
.cw-card .tag{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.cw-card h3{font-size:23px}
.cw-card .price{font-size:15px;color:var(--muted)}.cw-card .price b{font-size:26px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.cw-card p{font-size:14.5px;color:var(--muted)}
.cw-card ul{list-style:none;margin:6px 0 0;padding:16px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex:1}
.cw-card li{display:flex;gap:10px;font-size:14.5px}
.cw-card .cw-btn{align-self:flex-start;margin-top:10px}
.cw-card.pop{outline:3px solid #F3B98F;position:relative}
.cw-card.pop:before{content:'Signature';position:absolute;top:-13px;right:22px;background:#F3B98F;color:var(--wine2);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.04em}
/* results */
.cw-res{padding:110px 0 30px;background:#fff}
.cw-res-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px}
.cw-res h2{font-size:44px}
.cw-res-top p{color:var(--muted);margin-top:10px}
.cw-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:0}
.cw-stats div{padding:28px 0;display:flex;flex-direction:column;gap:4px}
.cw-stats div+div{padding-left:32px;border-left:1px solid var(--line)}
.cw-stats b{font-size:40px;font-weight:600;letter-spacing:-.03em;color:var(--wine)}
.cw-stats span{color:var(--muted);font-size:14.5px}
.cw-quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cw-q{background:var(--cream);border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:18px}
.cw-q .res{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--wine)}
.cw-q blockquote{margin:0;font-size:16.5px;line-height:1.6;flex:1}
.cw-q .who{display:flex;align-items:center;gap:12px}
.cw-q .who span{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.cw-q .who b{display:block;font-size:14.5px}.cw-q .who small{color:var(--muted);font-size:13px}
/* guide */
.cw-guide{background:linear-gradient(180deg,#FDF1E5,#FBE6D4);padding:110px 0}
.cw-guide .cw-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:stretch}
.cw-form{background:#fff;border-radius:6px;padding:40px;display:flex;flex-direction:column;gap:18px}
.cw-form h2{font-size:34px}
.cw-form p.sub{color:var(--muted);font-size:15.5px}
.cw-f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cw-form label{display:flex;flex-direction:column;gap:7px;font-size:13.5px;font-weight:600}
.cw-in{font:inherit;font-size:14.5px;font-weight:400;height:48px;padding:0 14px;border:1px solid var(--line);background:#FBF7F3;border-radius:4px;color:var(--ink);width:100%}
.cw-in:focus{outline:2px solid var(--wine);outline-offset:-1px;background:#fff}
.cw-form .note{font-size:12.5px;color:var(--muted)}
.cw-done{background:var(--cream);border-radius:6px;padding:18px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.cw-guide .ph{border-radius:6px;overflow:hidden;min-height:480px;position:relative}
.cw-guide .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.cw-guide .ph .badge{position:absolute;left:20px;bottom:20px;background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--wine2)}
/* video */
.cw-vid{padding:110px 0;background:#fff}
.cw-vbox{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/8.4;max-width:1000px;margin:0 auto;cursor:pointer}
.cw-vbox img{width:100%;height:100%;object-fit:cover}
.cw-vbox .cw-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cw-vbox .cap{position:absolute;left:22px;bottom:20px;color:#fff;font-size:14px;font-weight:600;background:rgba(56,16,42,.6);padding:8px 14px;border-radius:999px}
/* podcast */
.cw-pod{background:linear-gradient(180deg,var(--wine) 0,var(--wine) 62%,var(--cream) 62%);padding:110px 0 90px}
.cw-pod .cw-head h2,.cw-pod .cw-head{color:#fff}
.cw-pod .cw-head p{color:rgba(255,255,255,.78)}
.cw-listen{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cw-listen span{border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600}
.cw-pbox{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:16/8.4;max-width:1000px;margin:0 auto;box-shadow:0 30px 60px rgba(56,16,42,.3)}
.cw-pbox img{width:100%;height:100%;object-fit:cover}
.cw-pbox .cw-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cw-eps{max-width:1000px;margin:34px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cw-ep{background:#fff;border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.cw-ep small{color:var(--wine);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.cw-ep b{font-size:16px;font-weight:600;line-height:1.35}
.cw-ep span{color:var(--muted);font-size:13.5px}
/* journal */
.cw-jr{background:var(--cream);padding:20px 0 110px}
.cw-jr-top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px}
.cw-jr h2{font-size:40px}
.cw-posts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cw-post{background:#fff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.cw-post .im{aspect-ratio:4/3;overflow:hidden}.cw-post .im img{width:100%;height:100%;object-fit:cover}
.cw-post .tx{padding:22px;display:flex;flex-direction:column;gap:8px}

" id="cw-home"><div class="cw-wrap"><div class="cw-hero-copy"><span class="cw-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>Leadership coach &amp; keynote speaker · Los Angeles</span><h1>Connect to yourself, so you can <em>inspire others.</em></h1><p class="cw-lead">Keynotes, team experiences and executive coaching on self-trust, inner confidence and authentic connection, from a Master Certified Life Coach with more than 10,000 coaching hours.</p><div style="display:flex;gap:12px;flex-wrap:wrap;"><a class="cw-btn" onClick="{{go.contact}}" role="button" tabindex="0">Check Availability<span class="cw-arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div><div class="cw-trust"><div><b>Harvard and Oxford educated</b><small>Ironman finisher, 25+ marathons, 54 countries</small></div></div></div><div class="cw-hero-art"><div class="glow"></div><img class="cut" src="/meredithbaker/img/mb-hero.webp" alt="Meredith Baker, leadership coach and keynote speaker, smiling"><div class="cw-float ep"><span class="th"><img src="/meredithbaker/img/mb-mic.jpg" alt="" loading="lazy"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></i></span><span><small>On stage</small><b>Self-trust and authentic connection</b></span></div><div class="cw-float cert"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-1.5 8 5-3 5 3-1.5-8"/></svg></span><span><b>ICF accredited</b><small>Master Certified Life Coach</small></span></div></div></div></section><section class="cw-logos" aria-label="Background"><div class="cw-wrap"><i>Background</i><span class="cw-lg" style="font-family:'Instrument Serif',serif;font-size:20px;">Harvard College</span><span class="cw-lg" style="font-family:'Instrument Serif',serif;font-size:20px;">University of Oxford</span><span class="cw-lg" style="font-weight:800;letter-spacing:.08em;">BBC WORLDWIDE</span><span class="cw-lg" style="font-weight:700;">Houston Chronicle</span><span class="cw-lg" style="font-weight:600;">KHOU-TV <b style="font-weight:800;">Great Day Houston</b></span></div></section><section class="cw-about" id="cw-about"><div class="ph"><img src="/meredithbaker/img/mb-jacket.jpg" alt="Meredith Baker smiling in a colourful patterned jacket" loading="lazy"></div><div class="tx"><span class="cw-eyebrow" style="color:#F3B98F;">About Meredith</span><h2>Hi, I’m Meredith: leadership coach, keynote speaker and facilitator.</h2><p>I went to Harvard and Oxford, I was raised by an astronaut, I did an Ironman, ran more than 25 marathons and travelled to 54 countries. Along the way I realised it’s not what we do, it’s why we do it, and how it connects us more deeply to ourselves and others.</p><p>That set me on a decade-long journey to unlearn people-pleasing, operate from my internal compass and live from my joy. I’ve brought this inner and outer connection to more than 10,000 people and dozens of companies.</p><a class="cw-btn light" style="align-self:flex-start;" onClick="{{go.programs}}" role="button" tabindex="0">See Her Talks<span class="cw-arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><div class="cw-why"><b>Why book Meredith?</b><span><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>Master Certified Life Coach, accredited through the ICF</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>More than 10,000 coaching hours</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>NLP practitioner</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>500-hour yoga, meditation and breathwork instructor</span></div></div></section><section class="cw-prob"><div class="cw-wrap"><div class="cw-sol"><h3>Her approach</h3><p>Through <b style="color:#2B1220;">playful creativity and genuine curiosity</b>, leaders and teams learn to trust themselves, connect for real and own their authentic story.</p><span class="ok"><span class="cw-chk" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>Self-trust. Confidence. Connection.</span><div class="im"><img src="/meredithbaker/img/mb-rooftop.jpg" alt="Meredith Baker guiding a rooftop breathwork session with a microphone" loading="lazy"></div></div><div><span class="cw-eyebrow" style="color:#F3B98F;">Is this you?</span><h2 style="margin-top:14px;">Is Your Team Ready to Connect?</h2><p class="sub">Meredith works with leaders and teams who want to perform well and feel good doing it.</p><div class="cw-rows"><div class="cw-row"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span><b>Leading from the outside in</b><small>Decisions shaped by other people’s expectations instead of your own internal compass.</small></span><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div><div class="cw-row"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span><span><b>Confidence that comes and goes</b><small>Strong on paper, but self-doubt shows up when the stakes are high.</small></span><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div><div class="cw-row"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l6-6M14 4l6 6M9 9l6 6M7 21h10"/></svg></span><span><b>Teams that don’t really connect</b><small>People work side by side every day without knowing each other or what drives them.</small></span><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div><div class="cw-row"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a7 7 0 017 7c0 3-2 5-4 6v3H9v-3c-2-1-4-3-4-6a7 7 0 017-7z"/><path d="M9 21h6"/></svg></span><span><b>Busy, but not fulfilled</b><small>Plenty of achievement, not much joy or meaning in the work.</small></span><span class="go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div></div></div></section><section class="cw-steps"><div class="cw-wrap"><div class="cw-head"><span class="cw-eyebrow">How it works</span><h2>How Booking Meredith Works</h2><p>From the first call to the follow-up, every session is shaped around your people.</p></div><div class="cw-steps-grid"><div class="ph"><img src="/meredithbaker/img/mb-workshop.jpg" alt="Meredith Baker leading a team workshop in a living room circle" loading="lazy"></div><div class="cw-step-cards"><div class="cw-step"><span class="n">01</span><h3>Discovery call</h3><p>A short call about your event, your audience and what you want people to leave with.</p></div><div class="cw-step"><span class="n">02</span><h3>Shaped for your people</h3><p>Meredith tailors the talk or experience to your team, your goals and your setting.</p></div><div class="cw-step"><span class="n">03</span><h3>On the day</h3><p>A keynote, workshop or team experience that is interactive, personal and fun.</p></div><div class="cw-step"><span class="n">04</span><h3>Keep the momentum</h3><p>Optional executive coaching and team facilitation after the event.</p></div></div></div></div></section><section class="cw-prog" id="cw-programs"><div class="bg"><img src="/meredithbaker/img/mb-yoga-class.jpg" alt="" loading="lazy"></div><div class="cw-wrap"><div class="cw-prog-top"><h2>Talks and Experiences</h2><p>For conferences, leadership offsites and team events. Every booking starts with a discovery call, so the session fits your audience.</p></div><div class="cw-cards"><div class="cw-card"><span class="tag">Keynote</span><h3>It’s Not What You Do, It’s Why You Do It</h3><span class="price">Conferences and leadership events</span><p>Lessons from Harvard, Oxford, an Ironman, 25+ marathons and 54 countries on leading from pur
