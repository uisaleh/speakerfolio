<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">Atul Jagga is a CPA (Ontario) and licensed RCIC-IRB, and the founder of The Biz Plans in Toronto. He works at the intersection of business strategy, finance and Canadian immigration, advising entrepreneurs, businesses and professional firms on business planning, financial modelling and corporate immigration. His background includes senior finance roles with organizations such as Moneris, Payfirma and Idea Cellular, where he managed a revenue portfolio of about $150 million and worked on projects involving major Canadian financial institutions including RBC, BMO and CIBC. Through The Biz Plans, he leads business plans, financial models, market research and pitch decks for bank financing, investors, acquisitions, immigration applications and government tenders, across healthcare, financial services, technology, logistics, hospitality and consumer businesses. Atul holds an MBA in Finance and Strategy from UBC and an MBA in Marketing and Operations from Panjab University, has completed CFA Level I and CBV Level II, and is the author of Business Plan Essentials. He also created TheBizPlanAI, a free AI business plan generator, and mentors entrepreneurs with Futurpreneur.</span>
