<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">Kudra Mohammed is a business strategist, corporate trainer and the Founder and CEO of NIZARLINE, Kenya’s first hijab and scarf company, which she built into a luxury modest fashion house with operations across Africa and North America. Her luxury experience includes OMEGA under the Swatch Group, where as interim store director in St. Louis she led the boutique through renovation and relocation and helped lift its Google rating from 2.0 to 4.9 stars, and Lancôme, where she led campaigns and VIP customer experiences. With almost a decade in brand management, sales and commercial growth, she has delivered results including 55% revenue growth at NIZARLINE, a 30% sales increase at Saham Company and a 20% revenue increase at Rafiki Roofing. She is also the founder of The Nizar Foundation, which expands access to clean water, and mentors young leaders through Junior Achievement of Greater St. Louis. Today she helps businesses sharpen their market position, improve customer experience and build the systems for sustainable growth.</span>
