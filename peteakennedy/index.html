<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">Pete A. Kennedy partners with organizations, executives and teams to strengthen leadership capability, unlock natural talent, elevate workplace culture and translate professional development into measurable performance and sustainable results. He is the founder of Your Talents Matters, creator of the T.A.L.E.N.T. Framework and author of the international best seller When a Man Loves. With 25 plus years across corporate, education, faith based, government and nonprofit settings, Pete has developed 500 plus professionals and trained 150 plus leaders, with 95 percent rating their experience positive and 20 percent faster time to proficiency. His recent work includes Leadership Journey 101 at VISTA, with 81 percent participation and 95 percent of participants rating it relevant and effective, 150 plus leaders trained at Seminole Hard Rock Support Services, and 15 plus internal leaders promoted at Spirit Airlines within 12 months. Pete holds an M.S. in Educational Leadership and Administration from DeVry University and is a certified CliftonStrengths and DISC coach.</span>
