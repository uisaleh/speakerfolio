<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">Anthony Baptiste doesn't speak from theory. He speaks from experience. Sentenced to 51 years to life as a first-time, non-violent offender, he was incarcerated on February 24, 2016. From his first day inside, he started learning the law, became a certified paralegal while incarcerated, and after his appeals were denied, he proved his sentence was illegal and filed a motion on his own that led to his release on February 18, 2026. Before incarceration, he worked as a concert promoter known for A-list celebrity events drawing upwards of 5,000 people. While incarcerated he also changed in mind, body, and spirit, from over 300 pounds, losing over 100 pounds, and became a certified personal trainer. Today he speaks on resilience, transformation, and second chances.</span>
