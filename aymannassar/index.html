<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">Ayman Nassar is a keynote speaker, investor-storyteller and stand-up comedian based in Hamilton, Ontario. By day he is a Certified Management Accountant and Senior Internal Auditor at ArcelorMittal Dofasco, after more than a decade in audit, accounting and quality roles in Kuwait with Al Babtain Group, United Real Estate Company, Alghanim Industries, United Arab Shipping Company and RSM Albazie. In April 2026 he finished the 270 km Marathon des Sables across the Sahara, the fourth Egyptian in history to do so, and was honoured by Egypt's Minister of Youth and Sports in Cairo. He sharpens his speaking on the stand-up comedy stage, shares a storytelling diary about dividend investing on the Egyptian Exchange and Boursa Kuwait, and believes a person is the balance between their personal and professional lives.</span>
