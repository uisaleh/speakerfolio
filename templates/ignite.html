<span style="font-size: 15.5px; line-height: 1.6; color: #4a4a50;">Why most strategies are forgotten a week after launch, and the three-sentence message that makes people repeat yours.</span>
<span style="display: flex; flex-direction: column; gap: 8px;"><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>Turn any plan into three sentences</span><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>Open with tension, not context</span><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>Leave the room with one line people quote</span></span></div></div><div style="display: grid; grid-template-columns: {{L.kTalkCols}}; gap: {{L.kGap}}px; align-items: center; padding: 36px 0; border-top: 1px solid rgba(17,17,17,0.14);">

<div style="display: flex; flex-direction: column; gap: 14px;">

<span style="font-family: 'Anton', 'Archivo', Impact, sans-serif; font-size: {{L.f40}}px; line-height: 1.02; text-transform: uppercase; color: #111111;">The Three-Sentence Leader</span>
<span style="font-size: 15.5px; line-height: 1.6; color: #4a4a50;">A hands-on session where leaders rewrite their own strategy, update or pitch until it fits on one slide and one breath.</span>
<span style="display: flex; flex-direction: column; gap: 8px;"><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>A message map for every big change</span><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>Stories that prove the point</span><span style="display: flex; gap: 10px; font-size: 14.5px; line-height: 1.4; color: #111111;"><span style="flex: none; width: 18px; height: 18px; margin-top: 1px; background: #1F3BFF; color: #ffffff; display: flex; align-items: center; justify-content: center; border-radius: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 12l5 5L20 7"/></svg></span>Practice with live feedback</span></span></div></div><div style="display: grid; grid-template-columns: {{L.kTalkCols}}; gap: {{L.kGap}}px; align-items: center; padding: 36px 0; border-top: 1px solid rgba(17,17,17,0.14);">
