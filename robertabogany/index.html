<span style="font-size: {{L.f17}}px; line-height: 1.7; color: rgba(255,255,255,0.78);">For more than 25 years, Roberta Bogany has helped people navigate change. Her career began in learning and development, where she designed programs, facilitated workshops, coached learners and led large-scale organizational training, including more than 14 years at Houston Methodist, where she helped build a new Training and Simulation Center. Along the way she found that her greatest passion is helping people grow through life's transitions. She is the author of Life Happens: 10 Steps to Navigating Change and Transition and Relining the Empty Nest, and the creator of the workshops Standing in Your Season and The Me Yet to Be™. Roberta holds a Master of Education, a graduate certificate in communication and media studies from Walden University and is a certified life coach. Her mission is simple: to help people embrace where they are today while preparing for who they are becoming tomorrow.</span>
